<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Today's Plan</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6fb;
    color:#202124;
    min-height:100vh;
}

body.dark{
    background:#121318;
    color:#f5f5f5;
}

header{
    background:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
}

.dark header{
    background:#1b1d24;
    border-color:#292c35;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#667eea;
}

.header-buttons button{
    border:0;
    background:#f0f1f5;
    padding:10px 13px;
    border-radius:10px;
    cursor:pointer;
    font-size:17px;
}

.dark .header-buttons button{
    background:#292c35;
    color:white;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:32px;
    margin-bottom:7px;
}

.welcome p{
    color:#777;
}

.dark .welcome p{
    color:#aaa;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.dark .stat,
.dark .main-card{
    background:#1b1d24;
}

.stat-title{
    color:#777;
    font-size:14px;
}

.dark .stat-title{
    color:#aaa;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.main-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.add-area{
    display:grid;
    grid-template-columns:1fr 150px 120px;
    gap:10px;
    margin-bottom:20px;
}

input,select{
    padding:14px;
    border:1px solid #ddd;
    border-radius:11px;
    outline:none;
    font-size:15px;
    background:white;
}

.dark input,
.dark select{
    background:#252832;
    color:white;
    border-color:#3a3d47;
}

.add-btn{
    background:#667eea;
    color:white;
    border:0;
    border-radius:11px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#5568d8;
}

.progress-box{
    margin-bottom:25px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:14px;
}

.progress{
    height:10px;
    background:#e8e9ee;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#667eea;
    transition:.3s;
}

.filters{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.filters button{
    padding:9px 15px;
    border:0;
    border-radius:20px;
    cursor:pointer;
    background:#f0f1f5;
}

.dark .filters button{
    background:#292c35;
    color:white;
}

.filters button.active{
    background:#667eea;
    color:white;
}

.task{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    margin-bottom:10px;
    border:1px solid #eee;
    border-radius:14px;
    transition:.2s;
}

.dark .task{
    border-color:#30333d;
}

.task:hover{
    transform:translateY(-1px);
}

.check{
    width:20px;
    height:20px;
    cursor:pointer;
}

.task-content{
    flex:1;
}

.task-title{
    font-size:16px;
    font-weight:600;
}

.task-info{
    display:flex;
    gap:10px;
    margin-top:6px;
    font-size:12px;
    color:#777;
}

.completed .task-title{
    text-decoration:line-through;
    color:#999;
}

.priority{
    padding:5px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:bold;
}

.high{
    background:#ffe1e1;
    color:#d33;
}

.medium{
    background:#fff0c7;
    color:#9a7200;
}

.low{
    background:#dff6e5;
    color:#21863a;
}

.delete{
    border:0;
    background:#ffe5e5;
    color:#d33;
    width:34px;
    height:34px;
    border-radius:9px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:40px 10px;
    color:#999;
}

.clear{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#f0f1f5;
}

.dark .clear{
    background:#292c35;
    color:white;
}

@media(max-width:700px){

    header{
        padding:15px 20px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .add-area{
        grid-template-columns:1fr;
    }

    .add-btn{
        padding:14px;
    }

    .welcome h1{
        font-size:27px;
    }

    .main-card{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        📅 Today's <span>Plan</span>
    </div>

    <div class="header-buttons">
        <button onclick="toggleDark()">🌙</button>
    </div>

</header>


<div class="container">

    <div class="welcome">
        <h1>Plan your day 🚀</h1>
        <p id="date"></p>
    </div>


    <div class="dashboard">

        <div class="stat">
            <div class="stat-title">Total Tasks</div>
            <div class="stat-number" id="total">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Completed</div>
            <div class="stat-number" id="completed">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Remaining</div>
            <div class="stat-number" id="remaining">0</div>
        </div>

    </div>


    <div class="main-card">

        <div class="add-area">

            <input
                id="taskInput"
                placeholder="What do you need to do?"
                onkeydown="enterAdd(event)"
            >

            <select id="priority">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <button class="add-btn" onclick="addTask()">
                + Add Task
            </button>

        </div>


        <div class="progress-box">

            <div class="progress-top">
                <span>Today's Progress</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>


        <div class="filters">

            <button class="active" onclick="filterTasks('all',this)">
                All
            </button>

            <button onclick="filterTasks('active',this)">
                Active
            </button>

            <button onclick="filterTasks('completed',this)">
                Completed
            </button>

        </div>


        <div id="taskList"></div>


        <button class="clear" onclick="clearCompleted()">
            🧹 Clear Completed
        </button>

    </div>

</div>


<script>

let tasks =
JSON.parse(localStorage.getItem("todaysPlan")) || [];

let currentFilter = "all";


function save(){

    localStorage.setItem(
        "todaysPlan",
        JSON.stringify(tasks)
    );

}


function addTask(){

    const input =
    document.getElementById("taskInput");

    const priority =
    document.getElementById("priority").value;

    const text =
    input.value.trim();

    if(!text){

        alert("Please enter a task!");

        return;
    }


    tasks.push({

        id:Date.now(),

        text:text,

        priority:priority,

        completed:false

    });


    input.value="";

    save();

    display();

}


function enterAdd(e){

    if(e.key==="Enter"){

        addTask();

    }

}


function toggleTask(id){

    tasks =
    tasks.map(task=>{

        if(task.id===id){

            task.completed =
            !task.completed;

        }

        return task;

    });


    save();

    display();

}


function deleteTask(id){

    tasks =
    tasks.filter(task=>task.id!==id);

    save();

    display();

}


function clearCompleted(){

    tasks =
    tasks.filter(task=>!task.completed);

    save();

    display();

}


function filterTasks(type,button){

    currentFilter=type;

    document
    .querySelectorAll(".filters button")
    .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

    display();

}


function display(){

    const list =
    document.getElementById("taskList");

    list.innerHTML="";


    let filtered=tasks;


    if(currentFilter==="active"){

        filtered =
        tasks.filter(task=>!task.completed);

    }


    if(currentFilter==="completed"){

        filtered =
        tasks.filter(task=>task.completed);

    }


    if(filtered.length===0){

        list.innerHTML=
        `<div class="empty">
            ✨ No tasks here
        </div>`;

    }


    filtered.forEach(task=>{

        const div =
        document.createElement("div");

        div.className =
        "task " +
        (task.completed ? "completed":"");


        div.innerHTML=`

            <input
                class="check"
                type="checkbox"
                ${task.completed ? "checked":""}
                onchange="toggleTask(${task.id})"
            >

            <div class="task-content">

                <div class="task-title">
                    ${escapeHTML(task.text)}
                </div>

                <div class="task-info">

                    <span class="priority ${task.priority}">
                        ${task.priority.toUpperCase()}
                    </span>

                    <span>
                        Today
                    </span>

                </div>

            </div>

            <button
                class="delete"
                onclick="deleteTask(${task.id})">

                🗑️

            </button>

        `;


        list.appendChild(div);

    });


    updateStats();

}


function updateStats(){

    const total=tasks.length;

    const completed=
    tasks.filter(t=>t.completed).length;

    const remaining=
    total-completed;


    const percent=
    total===0
    ?0
    :Math.round((completed/total)*100);


    document.getElementById("total")
    .innerText=total;

    document.getElementById("completed")
    .innerText=completed;

    document.getElementById("remaining")
    .innerText=remaining;

    document.getElementById("percent")
    .innerText=percent+"%";

    document.getElementById("progressBar")
    .style.width=percent+"%";

}


function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );

}


function escapeHTML(text){

    const div=
    document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


function showDate(){

    const date=
    new Date();

    document.getElementById("date")
    .innerText=
    date.toLocaleDateString(
        "en-IN",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


if(
    localStorage.getItem("darkMode")==="true"
){

    document.body.classList.add("dark");

}


showDate();

display();

</script>
<div class="credit">Produced by Hardeep Singh</div>
</body>
</html>
