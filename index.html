<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Plan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 38px;
            margin: 10px 0;
        }

        .header p {
            margin: 5px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .date {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .add-btn {
            border: none;
            background: #667eea;
            color: white;
            padding: 0 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #5568d8;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 22px 0;
            padding: 15px;
            background: #f5f6ff;
            border-radius: 12px;
            color: #555;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            background: #f8f8f8;
            border-radius: 12px;
        }

        .task input[type="checkbox"] {
            flex: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            word-break: break-word;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            border: none;
            background: #ff5c5c;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .delete-btn:hover {
            background: #e04444;
        }

        .clear-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #ddd;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 25px;
        }

        @media (max-width: 500px) {
            .header h1 {
                font-size: 30px;
            }

            .input-area {
                flex-direction: column;
            }

            .add-btn {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📅 Today's Plan</h1>
        <p>Plan your day. Complete your goals. 🚀</p>
    </div>

    <div class="card">

        <div class="date" id="todayDate"></div>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do today?"
                onkeydown="handleEnter(event)"
            >
            <button class="add-btn" onclick="addTask()">Add Task</button>
        </div>

        <div class="stats">
            <span>Total: <b id="total">0</b></span>
            <span>Completed: <b id="completed">0</b></span>
            <span>Left: <b id="left">0</b></span>
        </div>

        <ul id="taskList"></ul>

        <button class="clear-btn" onclick="clearCompleted()">
            Clear Completed Tasks
        </button>

    </div>

</div>

<script>

    let tasks = JSON.parse(localStorage.getItem("todaysTasks")) || [];

    function showDate() {
        const today = new Date();

        const options = {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        };

        document.getElementById("todayDate").innerText =
            today.toLocaleDateString("en-IN", options);
    }

    function saveTasks() {
        localStorage.setItem("todaysTasks", JSON.stringify(tasks));
    }

    function addTask() {

        const input = document.getElementById("taskInput");
        const text = input.value.trim();

        if (text === "") {
            alert("Please enter a task!");
            return;
        }

        tasks.push({
            id: Date.now(),
            text: text,
            completed: false
        });

        input.value = "";

        saveTasks();
        displayTasks();
    }

    function handleEnter(event) {
        if (event.key === "Enter") {
            addTask();
        }
    }

    function toggleTask(id) {

        tasks = tasks.map(task => {

            if (task.id === id) {
                return {
                    ...task,
                    completed: !task.completed
                };
            }

            return task;
        });

        saveTasks();
        displayTasks();
    }

    function deleteTask(id) {

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();
        displayTasks();
    }

    function clearCompleted() {

        tasks = tasks.filter(task => !task.completed);

        saveTasks();
        displayTasks();
    }

    function displayTasks() {

        const list = document.getElementById("taskList");

        list.innerHTML = "";

        if (tasks.length === 0) {

            list.innerHTML =
                '<div class="empty">No plans yet. Add your first task! ✨</div>';

        } else {

            tasks.forEach(task => {

                const li = document.createElement("li");
                li.className = "task";

                li.innerHTML = `
                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})"
                    >

                    <span class="task-text ${task.completed ? "completed" : ""}">
                        ${escapeHTML(task.text)}
                    </span>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">
                        🗑
                    </button>
                `;

                list.appendChild(li);
            });
        }

        updateStats();
    }

    function updateStats() {

        const total = tasks.length;

        const completed =
            tasks.filter(task => task.completed).length;

        const left = total - completed;

        document.getElementById("total").innerText = total;
        document.getElementById("completed").innerText = completed;
        document.getElementById("left").innerText = left;
    }

    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

    showDate();
    displayTasks();

</script>

</body>
</html>
